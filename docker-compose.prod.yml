services:
  postgres:
    image: postgres:16-alpine
    container_name: fridge-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: fridge_manager
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fridge_postgres_data:/var/lib/postgresql/data
    networks:
      - fridge-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fridge-manager-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://fridge.ian-rounge.store
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/fridge_manager?schema=public
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - fridge-network

volumes:
  fridge_postgres_data:

networks:
  fridge-network:
    driver: bridge
